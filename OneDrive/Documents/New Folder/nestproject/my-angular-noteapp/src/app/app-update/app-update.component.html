<body>
  <div class="update-container">
    <h2>Update Details</h2>
    <form id="update-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter new username (optional)">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter new password (optional)">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter new email (optional)">
      </div>
      <div class="button-group">
        <button type="submit" class="save-button">Save Changes</button>
        <button type="reset" class="cancel-button">Cancel</button>
      </div>
    </form>
  </div>
</body>
